<svg xmlns="http://www.w3.org/2000/svg" width="580" height="196" viewBox="0 0 580 196" role="img" aria-label="RAG Pro">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5ec4f7" stop-opacity="0"/><stop offset=".5" stop-color="#5ec4f7"/><stop offset="1" stop-color="#5ec4f7" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.c{opacity:1;animation:up .9s .1s cubic-bezier(.2,.8,.2,1) forwards}
.edge{stroke-dasharray:18 82;animation:run 5s linear infinite}
.bar{animation:scan 3.5s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes run{to{stroke-dashoffset:-100}}
@keyframes scan{0%{transform:translateX(-200px)}100%{transform:translateX(620px)}}
</style>
<g class="c">
<rect x="2" y="2" width="576" height="192" rx="16" fill="#0d0d11" stroke="#26262c"/>
<rect class="edge" x="2" y="2" width="576" height="192" rx="16" fill="none" stroke="#5ec4f7" stroke-width="1.5" pathLength="100"/>
<rect class="bar" x="0" y="2" width="160" height="2" fill="url(#g)"/>
<text x="24" y="42" font-size="20" font-weight="600" fill="#fff">RAG Pro</text>
<text x="24" y="74" font-size="22" font-weight="300" fill="#5ec4f7">Recall@5 0.94 · MRR 0.92</text>
<text x="24" y="106" font-size="13.5" fill="#b7b7bf">Hybrid BM25 + dense retrieval, reranking, cited</text><text x="24" y="125" font-size="13.5" fill="#b7b7bf">answers and abstention; honest ablation.</text>
<rect x="24" y="150" width="34" height="24" rx="12" fill="#1f2a33"/><text x="41" y="166" font-size="12" fill="#5ec4f7" text-anchor="middle">RAG</text><rect x="65.6" y="150" width="41" height="24" rx="12" fill="#1f2a33"/><text x="86" y="166" font-size="12" fill="#5ec4f7" text-anchor="middle">BM25</text><rect x="114.39999999999999" y="150" width="62" height="24" rx="12" fill="#1f2a33"/><text x="146" y="166" font-size="12" fill="#5ec4f7" text-anchor="middle">FastAPI</text><rect x="184.8" y="150" width="26" height="24" rx="12" fill="#1f2a33"/><text x="198" y="166" font-size="12" fill="#5ec4f7" text-anchor="middle">CI</text>
</g></svg>