  <text x="331" y="78" font-size="44" font-weight="300" fill="#fff">97.9%</text>
  <text x="331" y="108" font-size="15" font-weight="600" fill="#5ec4f7">answer accuracy</text>
  <text x="331" y="132" font-size="12.5" fill="#9a9aa2">Filings Analyst, vs XBRL ground truth</text></g><g class="tile" style="animation-delay:0.51s">
  <rect x="606" y="12" width="285" height="146" rx="14" fill="#141418" stroke="#2a2a30"/>
  <rect class="sweep" x="606" y="12" width="285" height="146" rx="14" fill="none" stroke="#5ec4f7" stroke-width="1.5" pathLength="100" style="animation-delay:0.91s"/>
  <text x="628" y="78" font-size="44" font-weight="300" fill="#fff">0.94</text>
  <text x="628" y="108" font-size="15" font-weight="600" fill="#5ec4f7">extraction F1 at Filed</text>
