  <text x="34" y="78" font-size="44" font-weight="300" fill="#fff">0.993</text>
  <text x="34" y="108" font-size="15" font-weight="600" fill="#5ec4f7">PR-AUC on Azure ML</text>
  <text x="34" y="132" font-size="12.5" fill="#9a9aa2">fraud model, 408k held-out txns</text></g><g class="tile" style="animation-delay:0.33s">
  <rect x="309" y="12" width="285" height="146" rx="14" fill="#141418" stroke="#2a2a30"/>
