  <text x="925" y="78" font-size="44" font-weight="300" fill="#fff">250+</text>
  <text x="925" y="108" font-size="15" font-weight="600" fill="#5ec4f7">hours saved / month</text>
  <text x="925" y="132" font-size="12.5" fill="#9a9aa2">Python data pipelines at DHL</text></g></svg>