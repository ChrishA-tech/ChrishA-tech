<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Chrish Pep Felix A, Data Scientist and AI / ML Engineer">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b1"/><feGaussianBlur stdDeviation="12" result="b2"/>
  <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="haze" cx="78%" cy="45%" r="45%"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#03040a"/><stop offset=".55" stop-color="#03040a" stop-opacity=".6"/><stop offset="1" stop-color="#03040a" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.ring{stroke:#fff;fill:none;filter:url(#glow);opacity:0;animation:on 2.4s .3s forwards, hum 5s 3s ease-in-out infinite}
.r2{animation-delay:.9s,3.6s;stroke-dasharray:520 300}
.spin{transform-origin:940px 150px;animation:spin 9s linear infinite}
.tube{fill:#fff;filter:url(#glow);opacity:0;animation:on 2s forwards, hum 4s 2.5s ease-in-out infinite}
.t2{animation-delay:.6s,3s} .t3{animation-delay:1s,3.4s}
.name{opacity:1;animation:rise 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.sub{opacity:1;animation:rise 1.1s .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes on{0%{opacity:0}8%{opacity:1}12%{opacity:.1}18%{opacity:.9}22%{opacity:.2}30%,100%{opacity:.9}}
@keyframes hum{0%,100%{opacity:.9}50%{opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<rect width="1200" height="300" rx="18" fill="#03040a"/>
<rect width="1200" height="300" rx="18" fill="url(#grid)"/>
<rect width="1200" height="300" rx="18" fill="url(#haze)"/>
<rect class="tube" x="760" y="40" width="3" height="110" rx="2"/>
<rect class="tube t2" x="1120" y="60" width="3" height="90" rx="2"/>
<circle class="ring" cx="940" cy="150" r="96" stroke-width="3"/>
<circle class="ring r2" cx="950" cy="158" r="122" stroke-width="2"/>
<g class="spin"><circle cx="940" cy="150" r="108" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="60 620" stroke-linecap="round" filter="url(#glow)"/></g>
<rect class="tube t3" x="640" y="246" width="520" height="2" rx="1"/>
<rect width="760" height="300" rx="18" fill="url(#fade)"/>
<g class="name"><text x="64" y="118" font-size="56" font-weight="300" fill="#fff" letter-spacing="-1.5">Chrish Pep Felix A</text></g>
<g class="sub"><text x="66" y="156" font-size="18" fill="#bdbdbd">MSc Data Science &amp; AI · University of Liverpool · Liverpool, UK</text></g>

<text x="66" y="202" font-size="29" font-weight="600" fill="#5ec4f7">Data Scientist · AI / ML Engineer</text>
<g class="sub"><text x="66" y="250" font-size="15" fill="#8a8a8a">LLM agents · RAG · ML evaluation · MLOps on Azure ML &amp; Databricks</text></g>
</svg>